set_schedule:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: cozy_home
    entity_id:
      required: false
      selector:
        entity:
          integration: cozy_home
          domain: sensor
    schedule:
      required: true
      example: |
        weekdays:
          - { time: "06:30", mode: follow }
          - { time: "08:30", mode: follow, offset: -3 }
          - { time: "17:00", mode: follow }
          - { time: "22:00", mode: off }
        weekend:
          - { time: "07:30", mode: follow }
          - { time: "22:30", mode: fixed, temperature: 17 }
      selector:
        object:

get_schedule:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: cozy_home
    entity_id:
      required: false
      selector:
        entity:
          integration: cozy_home
          domain: sensor

clear_schedule:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: cozy_home
    entity_id:
      required: false
      selector:
        entity:
          integration: cozy_home
          domain: sensor

sync:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: cozy_home
    entity_id:
      required: false
      selector:
        entity:
          integration: cozy_home
          domain: sensor

boost:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: cozy_home
    entity_id:
      required: false
      selector:
        entity:
          integration: cozy_home
          domain: sensor
    temperature:
      required: false
      example: 22
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°"
          mode: box
    minutes:
      required: false
      default: 60
      selector:
        number:
          min: 5
          max: 1440
          step: 5
          unit_of_measurement: min
          mode: box

cancel_boost:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: cozy_home
    entity_id:
      required: false
      selector:
        entity:
          integration: cozy_home
          domain: sensor
