name: Release

# Releases are automatic: when a push to main changes the version in
# manifest.json, this workflow creates the tag vX.Y.Z and the GitHub release
# (with a zip of the integration attached). HACS reads releases to show
# version numbers and offer updates; the zip is for manual installs.
#
# Pushing a tag or publishing a release by hand still works: the job then
# checks the tag against manifest.json and attaches the zip.
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Work out the version and whether it needs a release
        id: info
        run: |
          version="$(jq -r .version custom_components/cozy_home/manifest.json)"
          case "${{ github.event_name }}" in
            release) tag="${{ github.event.release.tag_name }}" ;;
            push)
              if [ "${{ github.ref_type }}" = "tag" ]; then tag="${{ github.ref_name }}"; else tag="v$version"; fi ;;
          esac
          if [ "${tag#v}" != "$version" ]; then
            echo "Tag $tag does not match manifest version $version" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          # A push (branch or tag) with an existing release has nothing to do,
          # unless it is the release event itself (attach the zip).
          if [ "${{ github.event_name }}" = "push" ] && [ "$exists" = true ]; then
            echo "Release $tag already exists; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Build the integration zip
        if: steps.info.outputs.skip == 'false'
        run: |
          cd custom_components/cozy_home
          zip -r ../../cozy_home.zip . -x "__pycache__/*"

      - name: Create the release (and tag) or attach the zip
        if: steps.info.outputs.skip == 'false'
        env:
          TAG: ${{ steps.info.outputs.tag }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          if [ "${{ steps.info.outputs.exists }}" = true ]; then
            gh release upload "$TAG" cozy_home.zip --clobber
          else
            # --target creates the tag at this commit if it doesn't exist yet
            gh release create "$TAG" cozy_home.zip \
              --target "$GITHUB_SHA" \
              --title "Cozy Home $VERSION" \
              --generate-notes
          fi
